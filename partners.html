<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etho for partners — Be one of the first</title>
<meta name="description" content="Etho is bringing together the best dog services and brands. Apply to be one of the first providers and brands on the platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body>
<div class="page">

  <nav class="site-nav" aria-label="Primary">
    <a class="site-nav__mark" href="index.html">etho</a>
  </nav>

  <!-- 1 — Hero ---------------------------------------------------------- -->
  <section id="top" class="hero hero--partners on-dark" data-section="partners_hero">
    <div class="hero-scrim"></div>

    <div class="hero-content">
      <p class="hero-kicker">For providers and brands</p>
      <h1 class="hero-title">Be one of the first.</h1>
      <p class="hero-sub">Etho sends dog owners to the people and products worth paying for. We are choosing our founding partners now.</p>

      <div id="apply" class="access-slot">
        <form class="waitlist-form access-form"
              action="https://formsubmit.co/consuluque@gmail.com" method="POST"
              data-form-name="partner_application"
              data-done-message="Thanks — we'll be in touch about partnering.">
          <label class="u-visually-hidden" for="partner-email">Work email address</label>
          <input id="partner-email" type="email" name="email" class="waitlist-input"
                 placeholder="you@yourbusiness.com" autocomplete="email" required>
          <input type="hidden" name="_subject" value="New Etho partner application">
          <button type="submit" class="btn-solid waitlist-submit">Apply here</button>
        </form>
        <p class="waitlist-status" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-section="footer">
    <p class="site-footer__mark">etho</p>
    <p class="site-footer__tagline">Know their nature</p>
    <nav class="site-footer__links" aria-label="Footer">
      <a href="index.html">Home</a>
      <a href="mailto:hello@ethopethealth.com">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <p class="site-footer__domain">etho.pet</p>
  </footer>
</div>

<div class="sticky-cta" data-sticky-cta>
  <a class="btn-solid sticky-cta__btn" href="#apply">Apply here</a>
</div>

<script src="js/main.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
