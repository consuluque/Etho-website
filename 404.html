<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etho — Coming soon</title>
<meta name="description" content="Etho is coming soon.">
<link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon-64.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/coming-soon.css">
</head>
<body>

<main class="cs">
  <video class="cs__media" src="assets/videos/grey-dog.mp4"
         autoplay muted loop playsinline preload="auto"
         aria-label="Grey dog moving in warm daylight"></video>
  <div class="cs__scrim"></div>

  <h1 class="cs__mark">etho</h1>
  <p class="cs__line">Coming soon</p>

  <!-- Ships in the markup rather than being built by script, so it still
       submits with JS off; landing.js (initAccessForm) upgrades it to a
       fetch, the same as the home page's forms. -->
  <div class="cs__slot">
    <form class="cs__form access-form" data-form-name="holding"
          action="/api/waitlist" method="POST">
      <label class="cs__label" for="waitlist-email">Email address</label>
      <input id="waitlist-email" type="email" name="email" class="cs__input"
             placeholder="goodhuman@mail.com" autocomplete="email" required>
      <div class="hp" aria-hidden="true">
        <label for="waitlist-website">Leave this field empty</label>
        <input id="waitlist-website" type="text" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="cs__submit">Join waitlist</button>
    </form>
    <p class="cs__note">You’ll also get community invites and occasional offers. Unsubscribe anytime.</p>
    <p class="cs__status" data-form-status aria-live="polite"></p>
  </div>
</main>

<script>
// The video is a backdrop. iOS paints its own start-playback button over
// any video it has refused to autoplay — in Low Power Mode it refuses
// every time — and neither CSS nor opacity reliably suppresses that
// control. So a video that will not play is taken out of the document:
// with no element there is no button, and the still frame behind it
// carries the page. A later tap puts it back and plays it.
(function () {
  var video = document.querySelector('.cs__media');
  if (!video) return;

  var parent = video.parentElement;
  var anchor = video.nextSibling;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var detached = false;

  function detach() {
    if (detached) return;
    detached = true;
    video.classList.remove('is-playing');
    video.remove();
  }

  function tryPlay() {
    if (reduced.matches) { detach(); return; }
    if (detached) { detached = false; parent.insertBefore(video, anchor); }
    if (!video.paused) return;
    var played = video.play();
    // A rejection is the browser refusing outright, which is exactly the
    // case that would draw the button.
    if (played) played.catch(detach);
  }

  video.addEventListener('playing', function () { video.classList.add('is-playing'); });
  video.addEventListener('pause', function () { video.classList.remove('is-playing'); });
  video.addEventListener('error', detach);
  video.addEventListener('loadeddata', tryPlay);
  video.addEventListener('canplay', tryPlay);

  ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
    window.addEventListener(evt, tryPlay, { once: true, passive: true });
  });

  // Nothing running shortly after load means autoplay was declined
  // without rejecting the promise; drop the element rather than leave it
  // showing a control.
  setTimeout(function () { if (!detached && video.paused) detach(); }, 2500);

  tryPlay();
  reduced.addEventListener('change', tryPlay);
})();
</script>
<script src="js/landing.js"></script>
</body>
</html>
