<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etho — For the love of dogs</title>
<meta name="description" content="Ever wondered if your dog is actually happy? Etho is a smart collar and app that tracks your dog's health, behaviour and happiness.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="page">

  <section id="top" class="hero on-dark">
    <video class="hero__media" src="assets/videos/grey-dog.mp4"
           poster="assets/images/hero-poster.jpg"
           autoplay muted loop playsinline preload="auto"
           aria-label="Grey dog moving in warm daylight"></video>
    <div class="hero-scrim"></div>

    <nav class="hero-nav" aria-label="Primary">
      <a class="hero-nav__mark" href="#top">etho</a>
      <a class="hero-nav__cta" href="#waitlist">Join waitlist</a>
    </nav>

    <div class="hero-content">
      <h1 class="hero-title">For the love of dog</h1>
      <p class="hero-sub">Ever wondered if your dog is actually happy?</p>
      <div id="waitlist" class="hero-actions waitlist-slot">
        <a class="btn-outline-lg waitlist-btn" href="#">Join the waitlist</a>
      </div>
    </div>
  </section>

  <section class="closing-wrap">
    <div class="closing-cta on-dark">
      <img class="closing-bg" src="assets/images/Doggie5.jpg" alt="A dog standing in a warm patch of sunlight" onerror="this.remove()">
      <div class="closing-scrim"></div>
      <div class="closing-content">
        <h2 class="closing-title">Total peace of mind.</h2>
        <div class="waitlist-slot">
          <a class="btn-outline-lg closing-btn waitlist-btn" href="#">Join the waitlist</a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <img class="logo-img" src="assets/images/etho%20logo%20dark.png" alt="Etho" width="73" height="20" style="height:20px">
    <div class="footer-links">
      <a href="#">Shop</a>
      <a href="#">Become a partner</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
  </footer>
</div>

<script src="js/main.js"></script>
</body>
</html>
