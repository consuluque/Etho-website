<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etho — Give them more of the good life</title>
<meta name="description" content="Understand what your dog needs, then discover better ways to care for them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="page">

  <!-- The wordmark, small and centred at the top of the page. -->
  <nav class="site-nav" aria-label="Primary">
    <a class="site-nav__mark" href="#top">etho</a>
  </nav>

  <!-- 1 — Hero ---------------------------------------------------------- -->
  <section id="top" class="hero hero--v3 on-dark" data-section="hero">
    <video class="hero__media" src="assets/videos/grey-dog.mp4"
           autoplay muted loop playsinline preload="auto"
           aria-label="Grey dog moving in warm daylight"></video>
    <div class="hero-scrim"></div>

    <div class="hero-content hero-content--v3">
      <h1 class="hero-title">Give them more of the good life</h1>
      <p class="hero-sub">Understand what your dog needs, then discover better ways to care for them.</p>

      <!-- The form ships in the markup rather than being built by script,
           so it still submits with JS off; landing.js upgrades it to a
           fetch. -->
      <div id="early-access" class="access-slot">
        <form class="waitlist-form access-form" data-form-name="hero"
              action="https://formsubmit.co/consuluque@gmail.com" method="POST">
          <label class="u-visually-hidden" for="access-email">Email address</label>
          <input id="access-email" type="email" name="email" class="waitlist-input"
                 placeholder="goodhuman@mail.com" autocomplete="email" required>
          <input type="hidden" name="_subject" value="New Etho waitlist signup">
          <button type="submit" class="btn-solid waitlist-submit">Join the waitlist</button>
        </form>
        <p class="waitlist-status" aria-live="polite"></p>
      </div>
    </div>
  </section>

</div>

<script src="js/main.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
