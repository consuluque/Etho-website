<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Etho · Market map</title>
<link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Manrope';
    src: url('assets/fonts/manrope-latin.woff2') format('woff2');
    font-weight: 300 800;
    font-display: swap;
  }

  :root {
    --ink: #1F2230;
    --muted: rgba(31, 34, 48, 0.55);
    --faint: rgba(31, 34, 48, 0.42);
    --axis: rgba(31, 34, 48, 0.75);
    --navy: #232A55;
    --lavender: #EEE6F8;   /* marketplaces */
    --sky: #E4EEFC;        /* booking software */
    --mint: #E6F2DF;       /* multi-service platforms */
    --highlight: #FFF0A3;  /* the "high" end of each axis */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* One fixed-proportion canvas; every size inside is in cqw so the
     whole map scales as a unit and spacing never drifts. */
  .mm-wrap { max-width: 1200px; margin: 0 auto; overflow-x: auto; }
  .mm {
    min-width: 760px;
    container-type: inline-size;
  }
  .mm__grid { padding: 3cqw; }
  .mm__grid {
    display: grid;
    grid-template-columns: 15cqw 1fr;
    grid-template-rows: 50cqw auto;
    column-gap: 2.4cqw;
    row-gap: 1.8cqw;
  }

  /* Axis labels ------------------------------------------------------ */
  .mm__y {
    grid-column: 1; grid-row: 1;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .mm__x {
    grid-column: 2; grid-row: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .mm__label {
    margin: 0;
    font-size: 1.3cqw; line-height: 1.4; font-weight: 500;
    color: var(--muted);
  }
  .mm__label--hi {
    color: var(--ink); font-weight: 700;
    background: var(--highlight);
    padding: 0.9cqw 1.2cqw;
    border-radius: 0.9cqw;
  }
  .mm__y .mm__label { max-width: 14cqw; }
  .mm__y .mm__label:not(.mm__label--hi) { padding: 0 1.2cqw; }
  .mm__x .mm__label:not(.mm__label--hi) { padding-top: 0.9cqw; }
  .mm__x .mm__label--hi { max-width: 16cqw; }

  /* Plot ------------------------------------------------------------- */
  .mm__plot {
    grid-column: 2; grid-row: 1;
    position: relative;
    border-left: 1.5px solid var(--axis);
    border-bottom: 1.5px solid var(--axis);
  }
  /* chevron arrowheads at the open ends of both axes */
  .mm__plot::before, .mm__plot::after {
    content: ""; position: absolute;
    width: 0.8cqw; height: 0.8cqw;
    border: solid var(--axis); border-width: 1.5px 1.5px 0 0;
  }
  .mm__plot::before { top: 0; left: 0; transform: translate(calc(-50% - 0.75px), 10%) rotate(-45deg); }
  .mm__plot::after  { bottom: 0; right: 0; transform: translate(-10%, calc(50% + 0.75px)) rotate(45deg); }

  .mm__logo { position: absolute; top: 2.4cqw; right: 3cqw; height: 2.6cqw; }

  /* Clusters: soft rounded fields; content flows inside, so names can
     never sit outside their shade. */
  .mm__cluster {
    position: absolute;
    padding: 2.6cqw 3cqw;
    border-radius: 3.2cqw;
  }
  .mm__cluster--market  { left: 4cqw;  top: 2.4cqw;  width: 44cqw; background: var(--lavender); }
  .mm__cluster--booking { left: 2cqw;  bottom: 2.4cqw; width: 42cqw; background: var(--sky); }
  .mm__cluster--multi   { right: 4cqw; top: 19cqw;  width: 24cqw; background: var(--mint); }

  .mm__group {
    margin: 0 0 2cqw;
    font-size: 0.95cqw; line-height: 1.5; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--navy);
  }
  .mm__group span { display: block; font-weight: 600; color: var(--faint); letter-spacing: 0.12em; }

  .mm__list {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, max-content);
    column-gap: 4.5cqw; row-gap: 1.3cqw;
  }
  .mm__cluster--multi .mm__list { grid-template-columns: max-content; }

  .mm__co {
    display: flex; align-items: center; gap: 0.8cqw;
    font-size: 1.45cqw; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
  }
  .mm__co::before {
    content: ""; flex: none;
    width: 0.55cqw; height: 0.55cqw; border-radius: 50%; background: var(--ink);
  }
  .mm__co small { font-size: 0.78em; font-weight: 500; color: var(--faint); letter-spacing: 0.02em; }
</style>
</head>
<body>

<figure class="mm-wrap" style="margin:0 auto">
  <div class="mm" role="img" aria-label="Market map. Vertical axis: from an existing customer base with basic pet profiles, up to a shared customer network with rich pet profiles. Horizontal axis: from passive scheduling to proactive capacity optimisation. Marketplaces (consumer-led), top left: Tuft (UK), HugWag (JP), Groomit (US), TrimTrim (JP). Booking software (merchant-led), bottom left: Gingr (US), MoeGo (US), Petboost (AU), Square (US). Multi-service platforms, right: Fresha (Global), Vetted (IN).">
    <div class="mm__grid">

      <div class="mm__y">
        <p class="mm__label mm__label--hi">Shared customer network with rich pet profiles</p>
        <p class="mm__label">Existing customer base and basic pet profiles</p>
      </div>

      <div class="mm__plot">
        <img class="mm__logo" src="assets/images/etho%20logo%20dark.png" alt="Etho">

        <section class="mm__cluster mm__cluster--market">
          <p class="mm__group">Marketplaces<span>Consumer-led</span></p>
          <ul class="mm__list">
            <li class="mm__co">Tuft <small>UK</small></li>
            <li class="mm__co">HugWag <small>JP</small></li>
            <li class="mm__co">Groomit <small>US</small></li>
            <li class="mm__co">TrimTrim <small>JP</small></li>
          </ul>
        </section>

        <section class="mm__cluster mm__cluster--booking">
          <p class="mm__group">Booking software<span>Merchant-led</span></p>
          <ul class="mm__list">
            <li class="mm__co">Gingr <small>US</small></li>
            <li class="mm__co">MoeGo <small>US</small></li>
            <li class="mm__co">Petboost <small>AU</small></li>
            <li class="mm__co">Square <small>US</small></li>
          </ul>
        </section>

        <section class="mm__cluster mm__cluster--multi">
          <p class="mm__group">Multi-service<span>Platforms</span></p>
          <ul class="mm__list">
            <li class="mm__co">Fresha <small>Global</small></li>
            <li class="mm__co">Vetted <small>IN</small></li>
          </ul>
        </section>
      </div>

      <div class="mm__x">
        <p class="mm__label">Passive scheduling</p>
        <p class="mm__label mm__label--hi">Proactive capacity optimisation</p>
      </div>

    </div>
  </div>
</figure>

</body>
</html>
